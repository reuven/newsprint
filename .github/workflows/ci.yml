name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The `latest` job below is only useful if it runs when a dependency
  # moves, which has nothing to do with when this repository changes.
  schedule:
    - cron: "17 6 * * 1"

# A second push to the same branch supersedes the first: this suite takes
# a couple of minutes and nothing depends on the older run's result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS is what the author develops on; Linux is what everyone else
    # would install on, and is the only way to find out whether the
    # macOS-specific paths in _libpath.py really are no-ops elsewhere.
    # Windows is deliberately absent: printing goes through `lp` (CUPS),
    # which it does not have.
    # 3.12 is the floor the package declares; 3.14 is what it is developed
    # on. Both are tested, because "supports 3.12" is a claim on the PyPI
    # page that nothing else would check.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      # WeasyPrint loads Pango, cairo and GObject through ctypes at import
      # time, so they have to exist as real system libraries - a wheel
      # cannot supply them.
      - name: Install WeasyPrint's native libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libharfbuzz-subset0 libffi8

      - name: Install WeasyPrint's native libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install pango libffi

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # uv installs the interpreter itself, so this does not depend on
      # whichever Python the runner image happens to ship.
      - name: Sync the environment
        run: uv sync --locked --python ${{ matrix.python-version }}

      # The matrix claims to test the floor this package declares. Print
      # what actually got built, so "supports 3.12" is a claim with
      # evidence behind it rather than a line in a YAML file.
      - name: Say which Python this is
        run: uv run python -c "import sys; print(sys.version)"

      - name: Format
        run: uv run ruff format --check src tests scripts assets

      - name: Lint
        run: uv run ruff check src tests scripts assets

      - name: Types
        run: uv run mypy src

      # 100%, and reachable here: the corpus tests that need
      # tests/fixtures/ - a local archive of the author's own newsletters,
      # gitignored because it is other people's copyrighted mail - skip
      # cleanly, and every line and branch they used to be the only cover
      # for now has a unit test of its own. A contributor gets the same
      # guarantee the author does.
      - name: Tests
        run: >
          uv run pytest -q
          --cov=newsprint --cov-branch --cov-report=term-missing
          --cov-fail-under=100

  latest:
    name: latest dependencies
    # The `check` job above syncs --locked, which is the right thing for
    # telling a contributor whether their change works. It is also
    # structurally incapable of noticing that a dependency has moved:
    # it tests the lock file, and a user installing from PyPI does not
    # get the lock file.
    #
    # That gap shipped a crash. WeasyPrint 70 changed the url_fetcher
    # contract; the lock held 69, which never asks for the attribute 70
    # reads, so every test passed while a fresh install died on any
    # newsletter with an image that failed to fetch. This job resolves
    # the way a new user does and runs the same suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install WeasyPrint's native libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libharfbuzz-subset0 libffi8

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # No --locked, and --upgrade: take the newest of everything the
      # constraints in pyproject.toml allow, which is what `uv tool
      # install newsprint` resolves to.
      - name: Resolve the newest allowed dependencies
        run: uv lock --upgrade

      - name: Sync
        run: uv sync --python 3.14

      - name: Say what changed
        run: git --no-pager diff --stat uv.lock

      - name: Tests
        run: >
          uv run pytest -q
          --cov=newsprint --cov-branch --cov-report=term-missing
          --cov-fail-under=100
