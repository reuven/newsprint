[project]
name = "newsprint"
version = "0.2.0"
description = "Fetch starred newsletters over IMAP, reduce them to article content, and print them quarter-sheet, four to a side, duplex."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Reuven Lerner", email = "reuven@lernerpython.com" }
]
requires-python = ">=3.12"
keywords = ["email", "imap", "newsletter", "pdf", "printing", "imposition"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
    "Topic :: Printing",
]
dependencies = [
    "anthropic>=1.4.0",
    "beautifulsoup4>=4.15.0",
    "click>=8.5.0",
    "keyring>=25.7.0",
    "lxml>=6.1.3",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.17.0",
    "questionary>=2.1.1",
    "wcwidth>=0.8.3",
    "weasyprint>=69.0",
]

[project.urls]
Homepage = "https://github.com/reuven/newsprint"
Repository = "https://github.com/reuven/newsprint"
Issues = "https://github.com/reuven/newsprint/issues"

[project.scripts]
newsprint = "newsprint.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
# ruff infers py314 from requires-python and rewrites `except (A, B):` into
# PEP 758's unparenthesized `except A, B:`. That is valid 3.14, but mypy
# 1.18 cannot parse it and bails on the first file it hits - which left
# type checking silently covering nothing at all. Pinning the formatter one
# version back keeps the parentheses until mypy catches up.
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
# pymupdf ships types but leaves Document() itself untyped, so every
# pymupdf.open() reads as an untyped call. The results are converted
# explicitly at each call site instead.
untyped_calls_exclude = ["pymupdf"]

# WeasyPrint ships no py.typed marker, so its own types are invisible.
# Everything this project actually calls on it is wrapped behind
# render.FetchedResource and render.ImageFetcher, which are typed here.
[[tool.mypy.overrides]]
module = ["weasyprint.*"]
ignore_missing_imports = true
